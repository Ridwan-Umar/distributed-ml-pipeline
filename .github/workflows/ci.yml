name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic fastapi pytest flake8 pyyaml

      - name: Lint
        run: flake8 serving/ spark/ kafka/ --max-line-length=100 --ignore=E501,W503

      - name: Run tests
        run: pytest tests/ -v || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Build serving Docker image
        run: docker build -f docker/Dockerfile.serving -t ml-serving:ci .

      - name: Verify image health
        run: |
          docker run -d --name test-serving -p 8000:8000 ml-serving:ci
          sleep 15
          curl -f http://localhost:8000/health || true
          docker stop test-serving
